services:
  app:
    build: .
    container_name: livrosapi
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file: 
      - .env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
